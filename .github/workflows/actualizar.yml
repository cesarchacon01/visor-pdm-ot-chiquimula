name: Actualizar visor PDM-OT

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar Kobo y preparar datos públicos
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_SERVER: ${{ secrets.KOBO_SERVER }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
        run: python scripts/sincronizar_kobo.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
