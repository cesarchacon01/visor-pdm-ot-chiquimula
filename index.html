<!doctype html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico del PDM-OT · Chiquimula</title>
<meta name="description" content="Resultados del Diagnóstico rápido del PDM-OT en los 11 municipios de Chiquimula. Red de DMP · SEGEPLAN / CRS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9;--surface:#FFFFFF;--ink:#13233A;--ink2:#3A4A60;--muted:#66768A;--line:#DCE3EC;--line2:#EDF1F6;
  /* Azul institucional */
  --blue:#1E5AA8;--blue-d:#123F78;--blue-s:#E6EFFA;
  /* Colores por tema */
  --t-cont:#4C6A92;--t-cont-s:#E9EEF5;
  --t-plan:#1E5AA8;--t-plan-s:#E6EFFA;
  --t-risk:#0B8F9B;--t-risk-s:#E0F4F5;
  --t-seg:#6B4FBB;--t-seg-s:#EEEAF9;
  /* Semáforo de la boleta */
  --v:#2E9B5F;--v-s:#E3F4EA;--a:#EFA22B;--a-s:#FDF1DC;--r:#D2554F;--r-s:#FBE6E5;--s:#9AA6B3;--s-s:#EEF1F4;
  --radius:14px;--shadow:0 1px 2px rgba(19,35,58,.05),0 4px 14px rgba(19,35,58,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;overflow-x:hidden}
button,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--blue)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
@media(min-width:900px){.wrap{padding:0 28px}}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}

/* ---------- Cabecera ---------- */
.top{background:var(--blue-d);color:#fff}
.top-in{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:16px}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:var(--blue);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;stroke:#fff}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.brand p{font-size:13px;color:#B9CDE8}
.proto{font-size:12px;font-weight:600;color:#DCE7F5;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px}

/* ---------- Navegación: cuatro preguntas ---------- */
nav.qs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(19,35,58,.04)}
.qs-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-top:8px;padding-bottom:8px}
.qbtn{appearance:none;border:1px solid transparent;background:none;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;color:var(--ink2);transition:background .15s}
.qbtn:hover{background:var(--line2)}
.qbtn .qi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--line2);color:var(--ink2);flex:none;transition:all .15s}
.qbtn b{display:block;font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.25}
.qbtn small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.qbtn[aria-current="page"]{background:var(--blue-s);border-color:#C8DAF2}
.qbtn[aria-current="page"] .qi{background:var(--blue);color:#fff}
@media(max-width:860px){.qbtn small{display:none}.qbtn{padding:8px;gap:8px}.qbtn b{font-size:13px}.qbtn .qi{width:30px;height:30px}}
@media(max-width:520px){.qs-in{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Estructura ---------- */
main{padding:24px 0 56px}
.hero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.hero h2{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hero p{font-size:15.5px;color:var(--ink2);margin-top:6px;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media(max-width:1000px){.c4,.c5,.c7,.c8{grid-column:span 12}.c6{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-width:0}
.card h3{font-size:17px;font-weight:700;line-height:1.3}
.card .sub{font-size:13.5px;color:var(--muted);margin-top:3px}
.card>header{margin-bottom:14px}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-h .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.sec-h h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sec-h p{font-size:13.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.lead{font-size:16px;line-height:1.55;color:var(--ink)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}html{scroll-behavior:auto}}

/* ---------- Semáforo ---------- */
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface)}
.bar span{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.bar span.ka{color:#3A2A00}.bar span.ks{color:#2B3644}
.bar.sm{height:12px;border-radius:6px}.bar.sm span{font-size:0}
.bv{background:var(--v)}.ba{background:var(--a)}.br{background:var(--r)}.bs{background:var(--s)}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin-top:10px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill svg{width:13px;height:13px;stroke-width:2.6}
.p-verde{background:var(--v-s);color:#1D6B40}.p-amarillo{background:var(--a-s);color:#8A5600}.p-rojo{background:var(--r-s);color:#9B2F2A}.p-sin_informacion{background:var(--s-s);color:#4A5666}

/* ---------- Chips de municipio ---------- */
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mc{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 8px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:border-color .15s,transform .15s}
.mc:hover{border-color:var(--blue);transform:translateY(-1px)}
.mc .dot{width:10px;height:10px;border-radius:50%}
.byst{display:grid;gap:8px;margin-top:14px}
.byst>div{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:start}
.byst .lab{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding-top:4px}
@media(max-width:560px){.byst>div{grid-template-columns:1fr;gap:4px}}

/* ---------- A: resumen ---------- */
.stat{display:flex;flex-direction:column;gap:4px}
.stat .n{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .n small{font-size:16px;color:var(--muted);font-weight:600}
.stat .t{font-size:14px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats .card{padding:18px}
.stats .card .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:800px){.lists{grid-template-columns:1fr}}
.rank-free{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank-free li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.rank-free .nm{font-size:14px;font-weight:600}
.rank-free .nm button{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.rank-free .nm button:hover{color:var(--blue);text-decoration:underline}
.rank-free .bar{grid-column:1/-1}
.rank-free .ct{font-size:12.5px;color:var(--muted);white-space:nowrap}
@media(max-width:600px){.rank-free li{grid-template-columns:1fr}.rank-free .ct{white-space:normal}}
.spot{border:2px solid var(--t-risk);background:linear-gradient(var(--t-risk-s),var(--t-risk-s)) top/100% 6px no-repeat,var(--surface)}
.spot .tagr{display:inline-flex;align-items:center;gap:6px;background:var(--t-risk);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.spot .tagr svg{width:14px;height:14px}
.spotgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media(max-width:860px){.spotgrid{grid-template-columns:1fr}}
.rel{display:grid;gap:10px}
.rel .ri{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.rel .ri b{display:block;font-size:13.5px}
.caution{display:flex;gap:10px;align-items:flex-start;background:var(--line2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2);margin-top:14px}
.caution svg{width:18px;height:18px;margin-top:1px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:92px;transition:box-shadow .15s,transform .15s,border-color .15s}
.tile:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-2px)}
.tile b{font-size:13.5px;line-height:1.2}
.tile:focus-visible{border-color:var(--blue)}
.tile-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.tgo,.tsel{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--blue);white-space:nowrap}
.tgo .i,.tsel .i{width:13px;height:13px}
.tiles .tile-h{flex-direction:column;align-items:flex-start;gap:2px}
.tsel{color:#fff;background:var(--blue);border-radius:999px;padding:1px 8px 1px 5px}
.tile:hover .tgo,.tile:focus-visible .tgo{text-decoration:underline}
.tcnt{display:flex;gap:10px;font-size:11.5px;color:var(--muted,#5b6b7f);font-variant-numeric:tabular-nums}
.tcnt span{display:inline-flex;align-items:center;gap:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skey{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.skey summary{cursor:pointer;font-weight:800}
.skey p{margin:6px 0}
.skey ol{margin:0 0 8px;padding-left:22px;columns:3 210px;column-gap:18px}
.skey li{break-inside:avoid;padding:1px 0}
.tile.ghost{visibility:hidden}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.strip i{display:block;height:14px;border-radius:3px;position:relative}
.strip em{position:absolute;left:0;right:0;top:15px;font:600 9px/1 system-ui,sans-serif;font-style:normal;text-align:center;color:var(--muted,#5b6b7f)}
.strip{margin-bottom:10px}
.strip i:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#14243A;color:#fff;font:600 12px/1.3 system-ui,sans-serif;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none}
.strip i:first-child:hover::after,.strip i:nth-child(2):hover::after{left:0;transform:none}
.strip i:last-child:hover::after,.strip i:nth-child(8):hover::after{left:auto;right:0;transform:none}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.ghost{display:none}}
.years{position:relative;margin-top:6px}
.yrow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line2)}
.yrow:last-child{border-bottom:0}
.yrow .y{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.yrow .y small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.offs{display:grid;gap:8px}
.off{display:grid;grid-template-columns:minmax(150px,220px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.off .tr{height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
.off .fl{height:100%;background:var(--blue);border-radius:5px}
@media(max-width:560px){.off{grid-template-columns:1fr auto}.off .tr{grid-column:1/-1;order:3}}

/* ---------- B: criterios ---------- */
.gnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.gnav a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700;border:1px solid}
.grp-h{display:flex;gap:12px;align-items:center;margin:34px 0 14px;scroll-margin-top:90px}
.grp-h .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.grp-h h3{font-size:21px;font-weight:800;letter-spacing:-.01em}
.grp-h p{font-size:13.5px;color:var(--muted)}
.crit{border-left:5px solid var(--tc,var(--blue));scroll-margin-top:90px}
.crit .chd{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.crit .num{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--tcs);color:var(--tc);flex:none}
.crit .chd h4{font-size:17px;font-weight:700;line-height:1.3}
.crit .chd p{font-size:13.5px;color:var(--muted);margin-top:2px}
.levels{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px;margin-top:4px}
.csum{display:none}
@media(max-width:720px){
  .csum{display:grid;gap:10px}
  .ccnt{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:13.5px}
  .ccnt li{display:flex;align-items:center;gap:6px}.ccnt b{margin-left:auto;font-variant-numeric:tabular-nums}
  .ctog{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;color:var(--blue);cursor:pointer;text-align:left}
  .ctog .i{transition:transform .15s;flex:none;transform:rotate(90deg)}
  .crit.open .ctog .i{transform:rotate(-90deg)}
  .crit:not(.open) .cdet{display:none}
  .crit .cdet{margin-top:12px}
  .crit .l1>.bar{display:none}
  .crit .chd{margin-bottom:10px}
}
@media(max-width:980px){.levels{grid-template-columns:1fr}}
.lv{border-radius:12px;padding:14px;background:var(--bg)}
.lv .lt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.lv .lt svg{width:16px;height:16px}
.lv.l1{background:var(--surface);border:1px solid var(--line)}
.lv.l1 .lt{color:var(--ink2)}
.lv.l2 .lt{color:var(--blue-d)}
.lv.l3{background:#FFF8EC;border:1px dashed #E9C987}
.lv.l3 .lt{color:#8A5600}
.lv p,.lv li{font-size:13.5px;line-height:1.5}
.lv ul{margin:0;padding-left:18px;display:grid;gap:4px}
.lv .valid{font-size:11.5px;color:#8A5600;margin-top:8px;font-style:italic}
.extra{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.ex{border:1px solid var(--line);border-radius:10px;padding:12px}
.ex h5{margin:0 0 8px;font-size:13.5px}
.mini{display:grid;gap:6px}
.mini .mr{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;align-items:center}
.mini .mr .ms{font-size:12px;color:var(--muted);grid-column:1/-1;margin-top:-4px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table.mt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.mt th{font-size:12px;font-weight:700;color:var(--ink2);padding:8px 6px;text-align:center;vertical-align:bottom;line-height:1.25;border-bottom:1px solid var(--line);background:var(--surface)}
.mt th.g{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:#fff;border-bottom:0}
.mt td{padding:5px;text-align:center;border-bottom:1px solid var(--line2)}
.mt td:first-child,.mt th:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;min-width:150px;font-weight:600}
.mt td .pill{min-width:92px;justify-content:center}
details.full{margin-top:28px}
details.full summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
details.full summary::-webkit-details-marker{display:none}
details.full summary .chev{margin-left:auto;transition:transform .2s}
details.full[open] summary .chev{transform:rotate(90deg)}
details.full[open] summary{border-radius:var(--radius) var(--radius) 0 0}
details.full .body{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:16px 20px}

/* ---------- C: apoyo ---------- */
.hbars{display:grid;gap:14px}
.hb .top2{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.hb .top2 b{white-space:nowrap;font-variant-numeric:tabular-nums}
.hb .tr{height:12px;border-radius:6px;background:var(--line2);overflow:hidden}
.hb .fl{height:100%;border-radius:6px;background:var(--hc,var(--blue))}
.hb .who{font-size:12.5px;color:var(--muted);margin-top:4px}
.hb .who button{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.hb .who button:hover{color:var(--blue)}
.countnote{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cn{font-size:12.5px;background:var(--line2);border-radius:8px;padding:4px 10px;color:var(--ink2)}
.cn b{color:var(--ink)}
.h3b{margin-top:22px}
.plz{display:grid;gap:10px}
.pz{border-left:5px solid var(--lc);background:var(--bg);border-radius:10px;padding:10px 12px}
.pzh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pzh span{font-size:20px;font-weight:800}
.pzm,.cgm{display:flex;flex-wrap:wrap;gap:6px}
.pzm .mc small,.cgm .mc small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.pzm .mc,.cgm .mc{text-align:left;line-height:1.25;flex-direction:column;align-items:flex-start;gap:0;border-radius:10px;padding:5px 10px}
.cgs{columns:2 340px;column-gap:14px}
.cg{break-inside:avoid;display:inline-block;width:100%;border:1px solid var(--line);border-top:4px solid var(--t-risk);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.cgh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.cgh h4{font-size:15px}
.cgh span{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.cgx{margin:10px 0 0;padding:8px 0 0 18px;border-top:1px solid var(--line2);font-size:13.5px;display:grid;gap:4px;color:var(--ink2)}
.cgx0{margin-top:10px}
.cgn{display:flex;flex-wrap:wrap;gap:6px}
.cgd{margin-top:8px;font-size:13px}
.cgd summary{cursor:pointer;font-weight:700;color:var(--blue);padding:4px 0}
.cgd .cgx{border-top:0;padding-top:0;margin-top:6px}

 {id:'seg',t:'Registro de metas y seguimiento de avances',k:['metas_medibles','registro_metas','seguimiento'],

    const reg=md.includes('ninguno')?'La DMP indicó que no existe un registro de metas; conviene explorar qué forma sencilla de registro le resultaría útil':md.includes('no_sabe')?'La DMP no sabe dónde se registran las metas; conviene identificar qué oficina lleva ese registro':`Explorar cómo se usan hoy ${listY(md.map(k=>({excel:'la matriz de seguimiento en Excel',pei_pom_poa:'el PEI, el POM y el POA',plataforma:'el sistema o plataforma digital',informes_actas:'los informes o actas',otro:'otros instrumentos'})[k]).filter(Boolean))} para registrar las metas del PDM-OT`;
    const rev=['no_revisan','sin_periodicidad'].includes(fr)?' y cómo podría organizarse una revisión periódica de avances, que hoy no tiene una frecuencia definida':fr==='no_sabe'?' y quién revisa los avances, ya que no se conoce la frecuencia':` y qué decisiones se toman en la revisión ${lc(L.frecuencia[fr]||'')} de avances`;
    return reg+rev+(x.apo.length?`; pidió como apoyo ${listY(x.apo.map(a=>'«'+L.apoyos[a]+'»'))}.`:'.');}},
 {id:'act',t:'Actualización del plan y de sus datos',k:['datos_actuales','prioridades'],
  o:(r,x)=>{const f=x.nv.length?x.nv:x.cs;return `Conversar sobre ${nomC(f)} del plan${r.anio_aprobacion?` aprobado en ${r.anio_aprobacion}`:''}${r.en_actualizacion==='si'?', que la DMP indica que está en actualización,':r.en_actualizacion==='no'?', que no está en actualización,':''} y qué información necesitaría la DMP para ponerlo al día.`;}}];
const PESO={rojo:3,amarillo:2,sin_informacion:1,verde:0};
function orientaciones(m){const r=R[m];if(!r)return [];
  const ev=a=>{const cs=a.k.map(k=>CK[k]);const tem=[...new Set(cs.flatMap(c=>c.tema))].filter(t=>(r.temas||[]).includes(t));const apo=[...new Set(cs.flatMap(c=>c.apoyo))].filter(x=>(r.apoyos||[]).includes(x));
    const nv=cs.filter(c=>r[c.k]!=='verde'),pide=tem.length+apo.length;
    return {a,cs,tem,apo,nv,pide,nivel:nv.length&&pide?3:cs.some(c=>r[c.k]==='rojo')?2:pide?1:nv.length?0.5:0,peso:cs.reduce((s,c)=>s+PESO[r[c.k]],0)*2+tem.length*2+apo.length};};
  const cand=AMB.map(ev).filter(x=>x.nivel>0).sort((x,y)=>y.nivel-x.nivel||y.peso-x.peso);
  /* Un apoyo ya mencionado en una orientación anterior no basta, por sí solo, para abrir otra. */
  const usados=new Set(),sel=[];let sinPedir=0;
  for(const x of cand){if(sel.length>=4)break;const nuevos=x.apo.filter(a=>!usados.has(a));
    if(!x.pide){if(sinPedir>=2&&sel.length>=2)continue;sinPedir++;}   /* como máximo dos ámbitos que la DMP no pidió trabajar */
    if(x.nivel===1&&!x.tem.length&&!nuevos.length)continue;
    if(x.nivel<1&&sel.length>=2)continue;sel.push(x);x.apo.forEach(a=>usados.add(a));}
  const out=sel.map(x=>{const dec=[...x.cs.map(c=>`${c.n}. ${c.s}: ${ST[r[c.k]].l.toLowerCase()}`),x.tem.length?`pidió trabajar ${x.tem.map(t=>'«'+L.temas[t]+'»').join(' y ')}`:'',x.apo.length?`pidió como apoyo ${x.apo.map(t=>'«'+L.apoyos[t]+'»').join(' y ')}`:''].filter(Boolean);
    const extra=!x.nv.length?' La DMP valoró este ámbito como adecuado y aun así pidió trabajarlo: puede ser una oportunidad para consolidar lo que ya funciona.':!x.pide?' La DMP no pidió trabajar este tema; conviene preguntar si lo considera prioritario.':x.nv.every(c=>r[c.k]==='sin_informacion')?' La DMP no tenía información para valorar este ámbito; conviene identificar quién en la municipalidad podría completarla.':'';
    return {t:x.a.t,dec,o:x.a.o(r,x)+extra};});
  if(out.length<2&&r.necesidad)out.push({t:'Necesidad principal declarada',dec:[`necesidad principal: «${L.necesidad[r.necesidad]}»`,`modalidad: ${lc(L.modalidad[r.modalidad]||'sin dato')}`,`plazo: ${lc(L.plazo[r.plazo]||'sin dato')}`],o:'Iniciar la conversación por la necesidad que la DMP señaló como principal y definir con ella, en la reunión, por dónde empezar.'});
  return out.slice(0,4);}
const conFlag=k=>RESP.filter(m=>flags(m).some(x=>x.k===k));

  const fort=`<p style="font-weight:600">${esc(c.preg)}</p><p style="margin-top:10px">${weak.length} ${pl(weak.length,'municipio lo valora','municipios lo valoran')} como parcial o pendiente${weak.length?`; ${asks.length?`${asks.length} de ellos pidieron trabajar el tema «${esc(c.tema.map(t=>L.temas[t]).join('» o «'))}» (${names(asks)})`:'ninguno de ellos lo pidió como tema prioritario'}`:''}.</p><p class="valid">Pregunta orientadora para el diálogo técnico. No representa una decisión ni un compromiso municipal.</p>`;
  /* En teléfonos: resumen (barra y conteos) y un botón para desplegar el detalle. En computadora el detalle siempre está visible. */
  const open=S.abiertos&&S.abiertos.has(c.k);
  const resumen=`<div class="csum">${bar(Object.fromEntries(SK.map(k=>[k,d[k].length])),N)}<ul class="ccnt">${SK.map(k=>`<li><i class="dot ${ST[k].cls}"></i>${ST[k].l}<b>${d[k].length}</b></li>`).join('')}</ul><button type="button" class="ctog" data-tog="${c.k}" aria-expanded="${open}" aria-controls="cd-${c.k}"><span>${open?'Ocultar detalle':'Ver municipios y aspectos para el diálogo'}</span>${I.chev}</button></div>`;
  return `<article class="card crit${open?' open':''}" id="c-${c.k}" style="--tc:${g.c};--tcs:${g.cs}"><div class="chd"><span class="num">${c.n}</span><div><h4>${esc(c.s)}</h4><p>${esc(c.q)}</p></div></div>${resumen}

  <div class="prop o-prop"><div class="lt">Propuesta declarada por la DMP. No constituye un compromiso acordado.</div><div class="pa">${accND?'<span class="nd">La DMP aún no define la acción que propone iniciar.</span>':`<span class="pk">Acción que propone iniciar</span><b>${txt(r,'accion_prioritaria','accion')}</b>`}</div><div class="pc"><span class="pk">Oficina que podría coordinarla</span>${coND?'<span class="nd">Aún no definida</span>':txt(r,'coordina','coordina')}</div>${r.texto_corregido?'<p class="note">Texto revisado, con corrección ortográfica mínima.</p>':''}</div>
  <div class="sh-sec o-tri"><h4><span class="sw" style="background:var(--t-plan)"></span>Planificación, inversión, gestión del riesgo y ordenamiento territorial</h4><div class="trio">${tri}</div></div>
  <div class="sh-sec o-plan"><h4><span class="sw" style="background:var(--t-seg)"></span>Plan vigente, registro y seguimiento de metas</h4><dl class="facts">
   <div class="fact"><dt>Año de aprobación</dt><dd>${r.anio_aprobacion?`${r.anio_aprobacion} · ${a} ${pl(a,'año','años')}`:`No conocido (respuesta: ${L.si_no_ns[r.conoce_anio]||'—'})`} · ¿Lo actualizan? <b>${L.si_no_ns[r.en_actualizacion]||'—'}</b></dd></div>
   <div class="fact"><dt>Dónde registran las metas</dt><dd>${esc((r.medios_metas||[]).map(k=>L.medios[k]).join('; ')||'—')}${reg&&(r.contenido_metas||[]).length?`<div class="note">Contiene: ${esc(r.contenido_metas.map(k=>L.contenido[k]).join('; '))}</div>`:''}</dd></div>
   <div class="fact"><dt>Revisión de avances</dt><dd>${esc(L.frecuencia[r.frecuencia_revision]||'—')}${r.ejemplo_registro||(r.textos_pendientes||[]).includes('ejemplo')?` <span class="note">· Ejemplo: ${txt(r,'ejemplo_registro','ejemplo')}</span>`:''}</dd></div>
   <div class="fact"><dt>Oficinas en la municipalidad</dt><dd class="tags">${offs}</dd></div></dl></div>
  <div class="sh-sec o-nec"><h4><span class="sw" style="background:var(--t-risk)"></span>Necesidades y apoyo solicitado</h4><dl class="facts">
   <div class="fact"><dt>Necesidad principal</dt><dd><b>${esc(L.necesidad[r.necesidad]||'—')}</b></dd></div>
   <div class="fact"><dt>Modalidad y plazo</dt><dd>${esc(L.modalidad[r.modalidad]||'—')} · ${esc(L.plazo[r.plazo]||'—')}</dd></div>
   <div class="fact"><dt>Temas para trabajar primero</dt><dd class="tags">${(r.temas||[]).map(k=>`<span class="tg">${esc(L.temas[k])}</span>`).join('')||'—'}</dd></div>
   <div class="fact"><dt>Apoyo más útil</dt><dd class="tags">${(r.apoyos||[]).map(k=>`<span class="tg">${esc(L.apoyos[k])}</span>`).join('')||'—'}</dd></div>
   </dl></div>
  ${fl.length?`<div class="sh-sec o-conf"><div class="vbox"><div class="lt">${I.q}Aspectos para aclarar durante el diálogo con la DMP</div><ol class="vq">${fl.map(x=>`<li><span class="vr">${esc(x.t)}</span><span class="ve"><b>Por qué conviene aclararlo:</b> ${esc(x.e)}</span><span class="vp"><b>Pregunta sugerida:</b> ${esc(x.p)}</span></li>`).join('')}</ol><p class="note" style="margin-top:8px">Las dos respuestas se conservan tal como se dieron. Una diferencia entre respuestas no es un error: puede reflejar matices que la DMP puede aclarar.</p></div></div>`:''}
  ${oriHTML}
  <div class="sh-foot o-foot">${esc(D.meta.fuente)}. Valoraciones declaradas por la DMP en la boleta «Diagnóstico rápido del PDM-OT»; no son una evaluación ni una verificación institucional.</div></div></article>`;
  return h;
}

   8. Eventos
   ========================================================= */
document.addEventListener('click',e=>{
  const tg=e.target.closest('[data-tog]');if(tg){const k=tg.dataset.tog,art=$('c-'+k),o=!art.classList.contains('open');S.abiertos=S.abiertos||new Set();o?S.abiertos.add(k):S.abiertos.delete(k);art.classList.toggle('open',o);tg.setAttribute('aria-expanded',o);tg.querySelector('span').textContent=o?'Ocultar detalle':'Ver municipios y aspectos para el diálogo';return;}
  const t=e.target.closest('[data-view],[data-m],[data-crit],[data-anchor],#printBtn');if(!t)return;
  if(t.id==='printBtn'){window.print();return;}
  if(t.dataset.view){go(t.dataset.view,t.dataset.view==='municipio'?S.m:undefined);return;}
  if(t.dataset.m){go('municipio',t.dataset.m,'mbar');const hd=$('fichaT');if(hd)hd.focus({preventScroll:true});return;}
  if(t.dataset.crit){(S.abiertos=S.abiertos||new Set()).add(t.dataset.crit);go('mejorar',undefined,'c-'+t.dataset.crit);return;}
  if(t.dataset.anchor){e.preventDefault();const el=$(t.dataset.anchor);if(el)el.scrollIntoView({block:'start'});}
});
window.addEventListener('hashchange',()=>{parseHash();render();});

/* =========================================================
   9. Lectura de data.json
   ========================================================= */
const ORIGEN={url:'./data.json',refrescoMin:10};
let ESTADO={tipo:'cargando',texto:'',actualizado:null,local:false};
/* Traduce data.json (formato del script) al formato interno del visor.
   Acepta también los nombres de campo anteriores, por compatibilidad. */
function normalizar(json){
  const recs=Array.isArray(json.records)?json.records:(Array.isArray(json.registros)?json.registros:null);
  if(!recs)throw new Error('formato');
  const meta=json.meta||{};
  const porM={};
  for(const x of recs){
    if(!x||!MUN[x.municipio])continue;
    const r={...x,
      oficinas:x.oficinas||x.oficinas_existentes||[],temas:x.temas||x.temas_prioritarios||[],apoyos:x.apoyos||x.apoyos_requeridos||[],
      plazo:x.plazo||x.plazo_inicio||'',enviado:(x.enviado||x._submission_time)?utc(String(x.enviado||x._submission_time)):'',fecha:(x.fecha||'').slice(0,10),
      medios_metas:x.medios_metas||[],contenido_metas:x.contenido_metas||[],textos_pendientes:x.textos_pendientes||[]};
    if(!porM[r.municipio]||String(r.enviado)>String(porM[r.municipio].enviado))porM[r.municipio]=r; /* la más reciente */
  }
  const validos=recs.filter(x=>x&&MUN[x.municipio]).length;
  const dup=meta.duplicados?meta.duplicados.reduce((a,d)=>a+(d.descartados||0),0):validos-Object.keys(porM).length;
  return {updated_at:json.updated_at||meta.updated_at||null,registros:Object.values(porM),meta:{
    fuente:meta.fuente||'KoboToolbox · Diagnóstico rápido del PDM-OT',
    registros_recibidos:meta.recibidos??meta.registros_recibidos??recs.length,
    registros_omitidos:json.omitted??meta.registros_omitidos??0,
    duplicados_descartados:meta.duplicados_descartados??dup,
    campos_excluidos:meta.campos_no_publicados||meta.campos_excluidos||['Nombre de quien responde','Cargo','Observaciones adicionales'],
    textos_revisados:meta.textos_revisados||{fecha:null,criterio:''},
    textos_pendientes:meta.textos_pendientes||[],
    notas_control:meta.notas_control||[]}};
}
function aplicar(json,local){
  D=normalizar(json);
  R=Object.fromEntries(D.registros.map(r=>[r.municipio,r]));
  RESP=ALPHA.filter(k=>R[k]);MISS=ALPHA.filter(k=>!R[k]);N=RESP.length;
  ESTADO={tipo:N?'ok':'vacio',actualizado:D.updated_at,local:!!local};
  $('fuente').textContent=D.meta.fuente+' · '+N+' '+pl(N,'municipio','municipios')+(D.updated_at?' · datos del '+fmtFH(D.updated_at):'');
}
/* Las horas se muestran siempre en hora de Guatemala (UTC−6), sin importar la zona del equipo de quien consulta.
   Kobo entrega _submission_time en UTC; si llega sin zona, se interpreta como UTC. */
const utc=iso=>/(Z|[+-]\d\d:?\d\d)$/.test(iso)?iso:iso+'Z';
const fmtFH=iso=>{try{return new Intl.DateTimeFormat('es-GT',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'America/Guatemala'}).format(new Date(utc(iso)))+' (hora de Guatemala)';}catch(e){return iso;}};
function pintarEstado(){
  const e=$('estado');let h='';
  if(ESTADO.tipo==='cargando')h=`<div class="est info">${I.cal}<span>Cargando los datos publicados…</span></div>`;
  else if(ESTADO.tipo==='error')h=`<div class="est err">${I.info}<span><b>No se pudieron cargar los datos publicados.</b> ${esc(ESTADO.texto)}</span><button class="btn gh sm2" id="reintentar">Reintentar</button></div>`;
  else if(ESTADO.tipo==='vacio')h=`<div class="est warn">${I.info}<span><b>Aún no hay respuestas publicadas.</b> Cuando las DMP envíen la boleta en Kobo, los resultados aparecerán aquí después de la siguiente sincronización.</span></div>`;
  else h=`<div class="est ok">${I.check}<span>${ESTADO.local?'<b>Copia local para revisión.</b> ':''}Datos actualizados el ${esc(fmtFH(ESTADO.actualizado))} · ${N} de 11 municipios con respuesta${ESTADO.aviso?` · <b>${esc(ESTADO.aviso)}</b>`:''}</span>${ESTADO.local?'':'<button class="btn gh sm2" id="reintentar">Actualizar</button>'}</div>`;
  e.innerHTML=h;
}
async function cargar(silencioso){
  if(window.PDMOT_DATOS_LOCALES){aplicar(window.PDMOT_DATOS_LOCALES,true);pintarEstado();render();return;}
  if(!silencioso){ESTADO={tipo:'cargando'};pintarEstado();}
  try{
    if(location.protocol==='file:')throw new Error('local');
    const resp=await fetch(ORIGEN.url+'?t='+Date.now(),{cache:'no-store'});
    if(!resp.ok)throw new Error(resp.status===404?'noexiste':'http '+resp.status);
    let json;try{json=await resp.json();}catch(e){throw new Error('formato');}
    const antes=D&&D.updated_at;
    aplicar(json,false);
    if(silencioso&&antes&&antes!==D.updated_at)ESTADO.aviso='se actualizaron los resultados';
  }catch(err){
    if(D&&silencioso)return;                         /* conserva la vista anterior */
    const msg=err.message==='local'?'El visor se abrió desde el equipo. Use la dirección de GitHub Pages o el archivo vista-local.html que genera la prueba.':err.message==='formato'?'El archivo de datos no tiene el formato esperado. Revise la última ejecución de GitHub Actions.':err.message==='noexiste'?'No se encontró el archivo de datos publicado (data.json). Revise la última ejecución de GitHub Actions.':'Revise la conexión a internet e intente de nuevo. Si el problema continúa, revise la última ejecución de GitHub Actions.';
    ESTADO={tipo:'error',texto:msg};D=null;
  }
  pintarEstado();render();
}
document.addEventListener('click',e=>{if(e.target.closest('#reintentar'))cargar(false);});
parseHash();cargar(false);
setInterval(()=>{if(!ESTADO.local&&document.visibilityState==='visible')cargar(true);},ORIGEN.refrescoMin*60000);
</script>
